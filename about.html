<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Về chúng tôi – HAYWEB</title>
  <meta name="description" content="HAYWEB – Đội ngũ chuyên gia thiết kế web hơn 5 năm kinh nghiệm. Chúng tôi kiến tạo trải nghiệm số đẳng cấp.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://hayweb.vercel.app/about.html">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="home-dark-luxury">
<nav id="nav"></nav>

<div class="about-hero">
  <div class="container">
    <div class="section-label fade-up" style="justify-content:center" id="about-label"></div>
    <h1 class="section-title fade-up" id="about-title"></h1>
    <p class="section-desc fade-up" style="margin:0 auto;max-width:680px" id="about-desc"></p>
  </div>
</div>

<!-- Story -->
<section style="background:var(--surface);border-top:1px solid var(--border)">
  <div class="container">
    <div class="why-grid">
      <div>
        <div class="section-label fade-up" id="story-label"></div>
        <h2 class="section-title fade-up" id="story-title"></h2>
        <p class="section-desc fade-up" style="max-width:none;margin-bottom:1.5rem" id="story-p1"></p>
        <p style="font-size:.9rem;color:var(--muted);line-height:1.75" class="fade-up" id="story-p2"></p>
      </div>
      <div class="why-visual fade-up">
        <figure class="founder-portrait">
          <img src="images/founder-portrait.png"
               alt="Founder HAYWEB — chân dung studio Hà Nội"
               loading="lazy"
               width="720" height="960">
          <figcaption>
            <span class="founder-name">Founder · HAYWEB Studio</span>
            <span class="founder-title">Hà Nội · 2020 — Now</span>
          </figcaption>
        </figure>
      </div>
    </div>
  </div>
</section>

<!-- Comparison — HAYWEB vs 3 alternatives (kích cầu via direct contrast) -->
<section class="about-compare-section" data-nav-dark>
  <div class="container">
    <div class="text-center" style="margin-bottom:3rem">
      <div class="section-label fade-up" style="justify-content:center" id="compare-label"></div>
      <h2 class="section-title fade-up" id="compare-title"></h2>
      <p class="section-desc fade-up" style="margin:0 auto 0.5rem" id="compare-desc"></p>
    </div>
    <div class="about-compare-table fade-up" id="about-compare-table" role="table"></div>
    <div class="text-center fade-up" style="margin-top:2.5rem">
      <a href="/new-project.html" class="btn-primary" id="compare-cta" style="font-size:1rem;padding:0.95rem 2.4rem"></a>
      <p style="margin-top:0.85rem;font-size:0.78rem;color:var(--dark-muted);letter-spacing:0.05em" id="compare-cta-sub"></p>
    </div>
  </div>
</section>

<!-- Values -->
<section>
  <div class="container">
    <div class="text-center" style="margin-bottom:3.5rem">
      <div class="section-label fade-up" style="justify-content:center" id="values-label"></div>
      <h2 class="section-title fade-up" id="values-title"></h2>
    </div>
    <div class="values-grid" id="values-grid"></div>
  </div>
</section>

<!-- Stats -->
<section class="stats-section">
  <div class="container">
    <div class="stats-grid" id="stats-grid"></div>
  </div>
</section>

<!-- Team -->
<section>
  <div class="container">
    <div class="text-center" style="margin-bottom:3rem">
      <div class="section-label fade-up" style="justify-content:center" id="team-label"></div>
      <h2 class="section-title fade-up" id="team-title"></h2>
    </div>
    <div class="team-grid" id="team-grid"></div>
  </div>
</section>

<!-- CTA -->
<section class="cta-band">
  <div class="container text-center">
    <h2 class="section-title fade-up" id="cta-title"></h2>
    <div class="fade-up" style="margin-top:2rem">
      <a href="/new-project.html" class="btn-primary" style="font-size:1rem;padding:1rem 2.8rem" id="cta-btn"></a>
    </div>
  </div>
</section>

<footer id="footer"></footer>

<script src="js/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/page-about.js"></script>
</body>
</html>
