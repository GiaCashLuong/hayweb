<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – HAYWEB</title>
  <meta name="robots" content="noindex">
  <link rel="preload" href="fonts/inter-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/inter-600-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/playfair-roman-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/bvp-400-vi.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="home-dark-luxury">
<div class="dashboard-layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">HAY<span>WEB</span></div>
    <ul class="sidebar-nav">
      <li>
        <a href="/dashboard.html" class="active">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span id="nav-dash"></span>
        </a>
      </li>
      <li>
        <a href="/new-project.html">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          <span id="nav-new"></span>
        </a>
      </li>
      <li>
        <a href="/contact.html">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span id="nav-support"></span>
        </a>
      </li>
      <li style="margin-top:auto">
        <a href="#" id="sidebar-signout">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span id="nav-logout"></span>
        </a>
      </li>
    </ul>
  </aside>

  <!-- Main -->
  <main class="dashboard-main">
    <div class="dashboard-header">
      <h1 class="dashboard-title" id="dash-welcome"></h1>
      <a href="/new-project.html" class="btn-primary" id="dash-new-btn"></a>
    </div>

    <!-- Stats row -->
    <div class="stats-row" id="stats-row">
      <div class="stat-card"><div class="stat-card-num" id="s-total">–</div><div class="stat-card-label" id="l-total"></div></div>
      <div class="stat-card"><div class="stat-card-num" id="s-pending">–</div><div class="stat-card-label" id="l-pending"></div></div>
      <div class="stat-card"><div class="stat-card-num" id="s-signed">–</div><div class="stat-card-label" id="l-signed"></div></div>
      <div class="stat-card"><div class="stat-card-num" id="s-paid">–</div><div class="stat-card-label" id="l-paid"></div></div>
    </div>

    <!-- Projects table -->
    <h2 class="section-title" style="font-size:1.5rem;margin-bottom:1.5rem" id="proj-heading"></h2>
    <div id="projects-container">
      <p style="color:var(--muted);padding:2rem 0" id="no-proj-msg"></p>
    </div>
  </main>
</div>

<script src="js/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/page-dashboard.js"></script>
</body>
</html>
