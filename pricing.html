<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng giá – HAYWEB</title>
  <meta name="description" content="Bảng giá thiết kế website của HAYWEB – minh bạch, không phí ẩn. Starter 5tr, Professional 15tr, Enterprise 35tr.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://hayweb.vercel.app/pricing.html">
  <link rel="preload" href="fonts/inter-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/inter-600-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/playfair-roman-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/bvp-400-vi.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="home-dark-luxury">
<nav id="nav"></nav>

<div class="page-header">
  <div class="container">
    <div class="section-label fade-up" style="justify-content:center" id="price-label"></div>
    <h1 class="section-title fade-up" id="price-title"></h1>
    <p class="section-desc fade-up" style="margin:0 auto" id="price-desc"></p>
  </div>
</div>

<!-- Pain strip — 3 anti-patterns (kích cầu before tiers) -->
<section class="pricing-pain-section" data-nav-dark>
  <div class="container">
    <div class="text-center" style="margin-bottom:2.5rem">
      <div class="section-label fade-up" style="justify-content:center" id="pain-label"></div>
      <h2 class="section-title fade-up" id="pain-title" style="font-size:clamp(1.6rem,2.8vw,2.4rem)"></h2>
    </div>
    <div class="pricing-pain-grid" id="pain-strip"></div>
  </div>
</section>

<section>
  <div class="container">
    <div class="pricing-toggle" id="toggle-wrap">
      <span id="toggle-vnd"></span>
      <div class="toggle-switch" id="currency-toggle"></div>
      <span id="toggle-usd"></span>
    </div>
    <div class="pricing-preview" id="pricing-grid" style="max-width:none"></div>
  </div>
</section>

<!-- Trust band post-tier (risk-reversal stack) -->
<section class="pricing-trust-band" data-nav-dark>
  <div class="container text-center">
    <div class="pricing-trust-grid">
      <div class="trust-item fade-up"><strong>30/30</strong><span>Dự án bàn giao đúng hạn</span></div>
      <div class="trust-item fade-up"><strong>0</strong><span>Khiếu nại pháp lý sau bàn giao</span></div>
      <div class="trust-item fade-up"><strong>100%</strong><span>Sở hữu source code</span></div>
      <div class="trust-item fade-up"><strong>5 phút</strong><span>Báo giá tự động chi tiết</span></div>
    </div>
  </div>
</section>

<!-- Comparison table -->
<section style="background:var(--surface);border-top:1px solid var(--border)">
  <div class="container">
    <h2 class="section-title text-center fade-up" style="margin-bottom:2.5rem" id="compare-title"></h2>
    <div style="overflow-x:auto">
      <table class="compare-table" id="compare-table"></table>
    </div>
  </div>
</section>

<!-- FAQ -->
<section>
  <div class="container" style="max-width:800px">
    <h2 class="section-title text-center fade-up" style="margin-bottom:3rem" id="faq-title"></h2>
    <div id="faq-list"></div>
  </div>
</section>

<!-- CTA -->
<section class="cta-band">
  <div class="container text-center">
    <h2 class="section-title fade-up" id="cta-title"></h2>
    <div class="fade-up" style="margin-top:2rem">
      <a href="/new-project.html" class="btn-primary" style="font-size:1rem;padding:1rem 2.8rem" id="cta-btn"></a>
    </div>
  </div>
</section>

<footer id="footer"></footer>

<script src="js/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/page-pricing.js"></script>
</body>
</html>
