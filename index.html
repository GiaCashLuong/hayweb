<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAYWEB – Thiết kế website chuyên nghiệp tại Hà Nội</title>
  <meta name="description" content="HAYWEB – Thiết kế website cao cấp, chuyên nghiệp. Báo giá trong 5 phút, ký số trực tuyến, thanh toán online. Đẳng cấp khác biệt từ ngày đầu tiên.">
  <meta property="og:title" content="HAYWEB – Thiết kế website chuyên nghiệp">
  <meta property="og:description" content="Thiết kế không chỉ đẹp. Thiết kế để chinh phục.">
  <meta property="og:type" content="website">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://hayweb.vercel.app/">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav id="nav" role="navigation" aria-label="Main navigation"></nav>

<!-- HERO — light editorial split (text left, mockup right) -->
<section class="hero" id="home">
  <div class="hero-bg"></div>
  <div class="hero-content">
    <div class="hero-text">
      <div class="hero-eyebrow" id="hero-eyebrow"></div>
      <h1 class="hero-title" id="hero-title"></h1>
      <p class="hero-subtitle" id="hero-sub"></p>
      <div class="hero-benefits" id="hero-benefits"></div>
      <div class="hero-actions" id="hero-actions"></div>
    </div>

    <div class="hero-visual" aria-hidden="true">
      <div class="hero-mockup">
        <div class="hero-mockup-bar">
          <span class="hero-mockup-dot d1"></span>
          <span class="hero-mockup-dot d2"></span>
          <span class="hero-mockup-dot d3"></span>
          <span class="hero-mockup-url">hayweb.vercel.app/dashboard</span>
        </div>
        <div class="hero-mockup-body">
          <div class="hero-mockup-stats">
            <div class="hero-stat">
              <span class="hero-stat-num">5.2<small>×</small></span>
              <span class="hero-stat-lbl">Conversion</span>
            </div>
            <div class="hero-stat">
              <span class="hero-stat-num">−47<small>%</small></span>
              <span class="hero-stat-lbl">CPA</span>
            </div>
            <div class="hero-stat">
              <span class="hero-stat-num">#3</span>
              <span class="hero-stat-lbl">Google</span>
            </div>
          </div>
          <div class="hero-mockup-chart">
            <svg viewBox="0 0 320 110" preserveAspectRatio="none" role="img" aria-hidden="true">
              <line x1="0" y1="28" x2="320" y2="28" class="hero-grid"/>
              <line x1="0" y1="55" x2="320" y2="55" class="hero-grid"/>
              <line x1="0" y1="82" x2="320" y2="82" class="hero-grid"/>
              <path d="M 8 92 L 60 90 L 120 88 L 180 89 L 240 87 L 312 86" class="hero-line-before"/>
              <path d="M 8 92 L 60 78 L 120 62 L 180 44 L 240 26 L 312 12" class="hero-line-after"/>
              <circle cx="312" cy="12" r="4" class="hero-line-end"/>
            </svg>
            <div class="hero-mockup-legend">
              <span><i class="hero-swatch hero-swatch-before"></i>Trước HAYWEB</span>
              <span><i class="hero-swatch hero-swatch-after"></i>Sau 90 ngày</span>
            </div>
          </div>
        </div>
      </div>
      <div class="hero-mockup-badge">
        <span class="hero-badge-arrow" aria-hidden="true">↗</span>
        <span class="hero-badge-text">
          <strong>+340%</strong>
          <small>đơn hàng / tháng</small>
        </span>
      </div>
    </div>
  </div>

  <div class="hero-scroll" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round">
      <path d="M12 5v14M5 12l7 7 7-7"/>
    </svg>
    <span>Scroll</span>
  </div>
</section>

<!-- 4 PILLARS — varied storytelling per pillar -->
<section id="pillars" class="pillars-section">
  <div class="container">
    <div class="text-center" style="margin-bottom:3.5rem">
      <div class="section-label fade-up" style="justify-content:center" id="pillars-label"></div>
      <h2 class="section-title fade-up" id="pillars-title"></h2>
      <p class="section-desc fade-up" style="margin:0 auto" id="pillars-desc"></p>
    </div>
    <div class="pillars-grid" id="pillars-grid"></div>
  </div>
</section>

<!-- SERVICES (TABS) -->
<section id="services" style="padding-top:6rem">
  <div class="container">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:3rem;gap:2rem;flex-wrap:wrap">
      <div>
        <div class="section-label fade-up" id="svc-label"></div>
        <h2 class="section-title fade-up" id="svc-title"></h2>
        <p class="section-desc fade-up" id="svc-desc"></p>
      </div>
      <a href="/new-project.html" class="btn-outline fade-up" style="white-space:nowrap" id="svc-cta"></a>
    </div>
    <div class="services-tabs fade-up" id="services-tabs" role="tablist"></div>
    <div class="services-tabs-panels" id="services-panels"></div>
  </div>
</section>

<!-- STATS -->
<section class="stats-section">
  <div class="container">
    <div class="stats-grid" id="stats-grid"></div>
  </div>
</section>

<!-- TECH PARTNERS -->
<section style="border-top:1px solid var(--border);padding:2.5rem 0">
  <div class="container">
    <div class="partners-bar" id="partners-bar" aria-label="Technology partners"></div>
  </div>
</section>

<!-- PORTFOLIO PREVIEW -->
<section>
  <div class="container">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:3rem;flex-wrap:wrap;gap:1.5rem">
      <div>
        <div class="section-label fade-up" id="port-label"></div>
        <h2 class="section-title fade-up" id="port-title"></h2>
      </div>
      <a href="/portfolio.html" class="btn-outline fade-up" id="port-viewall"></a>
    </div>
    <div class="portfolio-grid" id="portfolio-grid"></div>
  </div>
</section>

<!-- COMPARISON — direct contrast pattern -->
<section id="comparison" class="comparison-section">
  <div class="container">
    <div class="text-center" style="margin-bottom:3.5rem">
      <div class="section-label fade-up" style="justify-content:center" id="cmp-label"></div>
      <h2 class="section-title fade-up" id="cmp-title"></h2>
    </div>
    <div class="comparison-table fade-up" id="comparison-table" role="table" aria-label="So sánh HAYWEB và đa số agency"></div>
  </div>
</section>

<!-- WHY US -->
<section style="background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border)">
  <div class="container">
    <div class="why-grid">
      <div>
        <div class="section-label fade-up" id="why-label"></div>
        <h2 class="section-title fade-up" id="why-title"></h2>
        <p class="section-desc fade-up" style="margin-bottom:3rem" id="why-desc"></p>
        <div class="why-items fade-up" id="why-items"></div>
      </div>
      <div class="why-visual fade-up" aria-hidden="true">
        <div class="why-mockup">
          <div class="why-mockup-bar">
            <span class="why-mockup-dot"></span>
            <span class="why-mockup-dot"></span>
            <span class="why-mockup-dot"></span>
            <span class="why-mockup-url">hayweb.vercel.app</span>
          </div>
          <div class="why-mockup-content">
            <div class="why-mockup-nav"></div>
            <div class="why-mockup-hero"></div>
            <div class="why-mockup-cards">
              <div></div><div></div><div></div>
            </div>
          </div>
        </div>
        <div class="why-visual-badge">
          <p id="why-badge-text"></p>
          <span id="why-badge-sub"></span>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- PROCESS -->
<section>
  <div class="container">
    <div class="text-center" style="margin-bottom:4rem">
      <div class="section-label fade-up" style="justify-content:center" id="proc-label"></div>
      <h2 class="section-title fade-up" id="proc-title"></h2>
    </div>
    <div class="process-steps" id="process-steps"></div>
  </div>
</section>

<!-- PRICING PREVIEW -->
<section style="background:var(--surface);border-top:1px solid var(--border)">
  <div class="container">
    <div class="text-center" style="margin-bottom:3.5rem">
      <div class="section-label fade-up" style="justify-content:center" id="price-label"></div>
      <h2 class="section-title fade-up" id="price-title"></h2>
      <p class="section-desc fade-up" style="margin:0 auto" id="price-desc"></p>
    </div>
    <div class="pricing-preview" id="pricing-preview"></div>
    <div class="text-center" style="margin-top:2.5rem">
      <a href="/pricing.html" class="btn-outline fade-up" id="price-viewall"></a>
    </div>
  </div>
</section>

<!-- TESTIMONIALS -->
<section>
  <div class="container">
    <div class="text-center" style="margin-bottom:3.5rem">
      <div class="section-label fade-up" style="justify-content:center" id="testi-label"></div>
      <h2 class="section-title fade-up" id="testi-title"></h2>
    </div>
    <div class="testimonials-grid" id="testimonials-grid"></div>
  </div>
</section>

<!-- SCARCITY CTA BAND — real daily slot count from Supabase -->
<section class="cta-band scarcity-band" id="scarcity">
  <div class="container">
    <div class="section-label fade-up" style="justify-content:center" id="sc-label"></div>
    <h2 class="section-title fade-up" id="sc-title"></h2>
    <p class="section-desc fade-up" style="margin:0 auto 2rem" id="sc-desc"></p>

    <div class="scarcity-counter fade-up" id="sc-counter" aria-live="polite">
      <div class="scarcity-counter-bar"><span id="sc-bar-fill"></span></div>
      <p class="scarcity-counter-text" id="sc-counter-text"></p>
    </div>

    <div class="scarcity-actions fade-up" id="sc-actions"></div>

    <form class="scarcity-form fade-up" id="sc-form" novalidate>
      <h3 id="sc-form-title"></h3>
      <p id="sc-form-desc"></p>
      <div class="scarcity-form-grid">
        <input type="text"  id="sc-name"  required maxlength="200" autocomplete="name">
        <input type="email" id="sc-email" required maxlength="200" autocomplete="email">
        <input type="tel"   id="sc-phone"          maxlength="40"  autocomplete="tel">
      </div>
      <!-- honeypot — hidden anti-bot field (code-006 pattern) -->
      <div aria-hidden="true" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;">
        <label for="sc-website">Website</label>
        <input type="text" id="sc-website" name="website" tabindex="-1" autocomplete="off">
      </div>
      <button type="submit" class="btn-primary" id="sc-submit"></button>
      <p class="scarcity-form-status" id="sc-status" role="status"></p>
    </form>
  </div>
</section>

<footer id="footer" role="contentinfo"></footer>

<script src="js/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/page-index.js"></script>

<!-- Analytics & Tracking (self-hosted per CSP rules) -->
<!-- TODO: Download gtag.js → save to js/gtag.js
     Get from: analytics.google.com → Admin → Data Streams → Web → Tag Instructions
     Then update GA4_ID in js/analytics.js -->
<script defer src="js/analytics.js"></script>
<!-- TODO: After getting Clarity project ID, uncomment below:
<script defer src="js/clarity-setup.js"></script>
-->
<script defer src="js/web-vitals.js"></script>
</body>
</html>
