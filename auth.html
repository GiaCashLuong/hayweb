<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập – HAYWEB</title>
  <meta name="robots" content="noindex">
  <link rel="preload" href="fonts/inter-400-latin.woff2" as="font" type="font/woff2">
  <link rel="preload" href="fonts/inter-600-latin.woff2" as="font" type="font/woff2">
  <link rel="preload" href="fonts/playfair-roman-latin.woff2" as="font" type="font/woff2">
  <link rel="preload" href="fonts/bvp-400-vi.woff2" as="font" type="font/woff2">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="home-dark-luxury">
<div class="auth-page">
  <div class="auth-visual">
    <div class="auth-visual-content">
      <p class="auth-visual-quote" id="auth-quote"></p>
      <span class="auth-visual-attr">— HAYWEB Studio</span>
    </div>
  </div>
  <div class="auth-panel">
    <a href="/index.html" class="nav-brand" style="display:inline-block;margin-bottom:2.5rem;text-decoration:none">
      HAY<span style="color:var(--gold)">WEB</span>
    </a>
    <h1 class="auth-title" id="auth-title"></h1>
    <p class="auth-subtitle" id="auth-subtitle"></p>

    <div class="social-login">
      <button class="btn-social" id="btn-google">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span id="btn-google-text"></span>
      </button>
    </div>

    <div class="auth-divider" id="auth-or"></div>

    <form id="auth-form">
      <div id="name-group" class="form-group" style="display:none">
        <label class="form-label" id="lbl-name"></label>
        <input type="text" id="input-name" class="form-input" autocomplete="name">
      </div>
      <div class="form-group">
        <label class="form-label" id="lbl-email"></label>
        <input type="email" id="input-email" class="form-input" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" id="lbl-pass"></label>
        <input type="password" id="input-pass" class="form-input" required autocomplete="current-password">
      </div>
      <div id="auth-error" class="form-error" style="margin-bottom:.75rem"></div>
      <button type="submit" class="btn-primary" id="auth-submit" style="width:100%;justify-content:center;margin-top:.5rem"></button>
    </form>

    <p class="auth-toggle" id="auth-toggle"></p>
  </div>
</div>

<script src="js/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/page-auth.js"></script>
</body>
</html>
