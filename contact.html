<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên hệ – HAYWEB</title>
  <meta name="description" content="Liên hệ HAYWEB để được tư vấn miễn phí về dự án website của bạn. Chung cư R3 Onsen, KĐT Ecopark. 0797 986 525.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://hayweb.vercel.app/contact.html">
  <link rel="preload" href="fonts/inter-400-latin.woff2" as="font" type="font/woff2">
  <link rel="preload" href="fonts/inter-600-latin.woff2" as="font" type="font/woff2">
  <link rel="preload" href="fonts/playfair-roman-latin.woff2" as="font" type="font/woff2">
  <link rel="preload" href="fonts/bvp-400-vi.woff2" as="font" type="font/woff2">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="js/leaflet.min.css">
</head>
<body class="home-dark-luxury">
<nav id="nav"></nav>

<div class="page-header">
  <div class="container">
    <div class="section-label fade-up" style="justify-content:center" id="con-label"></div>
    <h1 class="section-title fade-up" id="con-title"></h1>
    <p class="section-desc fade-up" style="margin:0 auto" id="con-desc"></p>
  </div>
</div>

<!-- 4-step "what happens next" trust strip — reduces form-friction (kích cầu) -->
<section class="contact-trust-section" data-nav-dark>
  <div class="container">
    <div class="contact-trust-grid" id="contact-trust-strip"></div>
  </div>
</section>

<section>
  <div class="container">
    <div class="contact-grid">
      <!-- Info -->
      <div class="contact-info">
        <div class="contact-info-item fade-up">
          <div class="contact-info-icon">
            <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          </div>
          <div>
            <h4 id="con-addr-title"></h4>
            <p>Chung cư R3 Onsen<br>KĐT Ecopark, Hưng Yên</p>
          </div>
        </div>
        <div class="contact-info-item fade-up">
          <div class="contact-info-icon">
            <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.07 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3 1.19h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21 16a2 2 0 0 1 1 1.92z"/></svg>
          </div>
          <div>
            <h4 id="con-phone-title"></h4>
            <p><a href="tel:0797986525" style="color:var(--silver-light)">0797 986 525</a></p>
          </div>
        </div>
        <div class="contact-info-item fade-up">
          <div class="contact-info-icon">
            <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>
          <div>
            <h4>Email</h4>
            <p><a href="mailto:gsg.zero@gmail.com" style="color:var(--silver-light)">gsg.zero@gmail.com</a></p>
          </div>
        </div>
        <div class="contact-info-item fade-up">
          <div class="contact-info-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div>
            <h4 id="con-hours-title"></h4>
            <p id="con-hours-val"></p>
          </div>
        </div>
        <div id="contact-map" class="fade-up"></div>
      </div>

      <!-- Form -->
      <div class="fade-up">
        <form id="contact-form">
          <div aria-hidden="true" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;">
            <label for="website">Website</label>
            <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="con-name" id="lbl-name"></label>
              <input type="text" id="con-name" class="form-input" required autocomplete="name">
            </div>
            <div class="form-group">
              <label class="form-label" for="con-email" id="lbl-email"></label>
              <input type="email" id="con-email" class="form-input" required autocomplete="email">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="con-phone" id="lbl-phone"></label>
            <input type="tel" id="con-phone" class="form-input" autocomplete="tel">
          </div>
          <div class="form-group">
            <label class="form-label" for="con-msg" id="lbl-msg"></label>
            <textarea id="con-msg" class="form-textarea" rows="5" required></textarea>
          </div>
          <div id="con-success" class="form-hint" style="color:var(--success);display:none"></div>
          <div id="con-error" class="form-error"></div>
          <button type="submit" class="btn-primary" id="con-send" style="margin-top:1rem"></button>
          <p class="form-reassurance">
            <span class="form-reassurance-icon" aria-hidden="true">🔒</span>
            <span class="form-reassurance-text" id="form-reassurance-text"></span>
          </p>
        </form>
      </div>
    </div>
    <!-- Alternative paths — for users not ready to fill form -->
    <div class="contact-alt-strip fade-up" id="contact-alt-strip"></div>
  </div>
</section>

<footer id="footer"></footer>

<script src="js/supabase.min.js"></script>
<script src="js/leaflet.min.js"></script>
<script src="js/config.js"></script>
<script src="js/page-contact.js"></script>
</body>
</html>
